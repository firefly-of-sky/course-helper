<!doctype html><meta charset="utf-8"><title>只连播视频 · 跨练习跨章验证</title>
<style>body{font:15px/1.7 system-ui;margin:28px;background:#f5f8fc;color:#23303e;max-width:720px}button{font:inherit}.chapter-name,.section-name,.page-name{padding:8px;cursor:pointer}.chapter-item{border:1px solid #cbd5dc;margin:12px 0}.page-name.active{background:#e4f1f9}.page-item{margin:4px}.page-name{border-left:2px solid transparent}.page-name.active{border-left-color:#236b91}#MathDiv video{width:300px;height:100px;background:#23303e}#log{white-space:pre-wrap}.next-page-btn{padding:8px}</style>
<h1>只连播视频 · 跨练习跨章验证</h1><p>本地三段 8 秒媒体，自然结束后模拟播放器回零。不会连接优学院。</p><button id="start" disabled>开始本地连续播放验证</button><div id="catalog"></div><div id="MathDiv"></div><button class="next-page-btn"><span class="page-title"><span class="text"></span></span></button><p id="log" role="status">正在加载…</p>
<script>
(async()=>{
 const module={exports:{}};new Function('module','window',await(await fetch('../../repaired.user.js')).text())(module,undefined);const core=module.exports;
 const names=['测试视频一','第一章练习（不得进入）','测试视频二','图文（略过）','测试视频三','末尾练习（不得进入）'];const types=[6,7,6,5,6,7];let index=0,ends=0,catalogClicks=0,nonVideoClicks=0,nextClicks=0,opens=0;
 const modelPages=names.map((name,i)=>({id:()=>i+1,name:()=>name,contentType:()=>types[i],isHide:()=>false}));
 const chapters=[0,1].map(c=>({id:()=>c+1,name:()=>`测试第${c+1}章`,isHide:()=>false,isPageLoaded:()=>true,sections:()=>[{id:()=>c+1,isHide:()=>false,pages:()=>c===0?modelPages.slice(0,2):modelPages.slice(2)}]}));
 const catalog=document.getElementById('catalog'),content=document.getElementById('MathDiv'),log=document.getElementById('log');
 chapters.forEach((chapter,c)=>{const node=document.createElement('div');node.className='chapter-item';node.id='chapter'+(c+1);node.innerHTML=`<div class="chapter-name">测试第${c+1}章</div><div class="section-list" ${c?'style="display:none"':''}><div class="section-item" id="section${c+1}"><div class="section-name">测试节</div><div class="page-list"></div></div></div>`;node.querySelector('.chapter-name').onclick=()=>{opens++;node.querySelector('.section-list').style.display='block';};catalog.append(node);});
 names.forEach((name,i)=>{const item=document.createElement('div');item.className='page-item';item.id='page'+(i+1);item.innerHTML=`<div class="page-name"><div class="page-icon"><i class="iconfont">${types[i]===6?'\ue852':types[i]===7?'\ue850':'\ue851'}</i></div><span data-bind="text: page.name()">${name}</span></div>`;item.querySelector('.page-name').onclick=()=>{catalogClicks++;if(types[i]!==6)nonVideoClicks++;index=i;render();};document.querySelector('#chapter'+(i<2?1:2)+' .page-list').append(item);});
 function updateLog(){log.textContent=`当前页：${names[index]}\n浏览器自然结束：${ends} 次\n目录切换视频：${catalogClicks} 次\n点击非视频任务：${nonVideoClicks} 次\n点击下一页：${nextClicks} 次\n展开下一章：${opens} 次`;}
 function render(){document.querySelectorAll('.page-name').forEach((node,i)=>node.classList.toggle('active',i===index));document.querySelector('.next-page-btn .text').textContent=names[index+1]||'末尾';content.replaceChildren();if(types[index]===6){const video=document.createElement('video');video.controls=true;video.muted=true;video.src='short-media.wav';video.addEventListener('ended',event=>{if(event.isTrusted)ends++;updateLog();},true);video.addEventListener('ended',()=>{video.currentTime=0;video.pause();});content.append(video);}else{const q=document.createElement('div');q.className='question-setting-panel';q.textContent='非视频页面（不应进入）';content.append(q);}updateLog();}
 document.querySelector('.next-page-btn').onclick=()=>{nextClicks++;index++;render();};
 const testWin={location:{hostname:'ua.ulearning.cn',pathname:'/learnCourse/learnCourse.html',href:'https://ua.ulearning.cn/learnCourse/learnCourse.html?courseId=fixture'},document,koLearnCourseViewModel:{course:{chapters:()=>chapters},currentPage:()=>modelPages[index],isMenuPack:()=>false},MutationObserver,queueMicrotask:window.queueMicrotask.bind(window),addEventListener:window.addEventListener.bind(window),removeEventListener:window.removeEventListener.bind(window),setTimeout:window.setTimeout.bind(window),clearTimeout:window.clearTimeout.bind(window)};testWin.top=testWin;
 render();const values=new Map([[core.SETTINGS_KEY,{rate:2,muted:true,autoPlay:false,autoNext:true,videoOnly:true}]]);const helper=core.start(testWin,document,{get:async(k,f)=>values.get(k)||f,set:async(k,v)=>values.set(k,v)});await helper.ready;const start=document.getElementById('start');start.disabled=false;start.onclick=()=>{helper.root.getElementById('auto-play').checked=true;helper.root.getElementById('apply').click();start.disabled=true;};
})();
</script>
